name: Deploy to Firebase Hosting on Production (Main)
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Finance App/package-lock.json'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build
        working-directory: Finance App

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseCLI: ${{ secrets.FIREBASE_TOKEN }}
          projectId: finance-app-a08c0
          channelId: live
          entryPoint: Finance App
